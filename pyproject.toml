[project]
name = "pyinfra-tasmota"
dynamic = ["version"]
description = "A Pyinfra connector to manage Tasmota devices via their HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martin F. Krafft" }]
dependencies = ["pyinfra>=3.10", "requests>=2.31"]

[project.entry-points."pyinfra.connectors"]
tasmota = "pyinfra_tasmota.connector:TasmotaConnector"

[dependency-groups]
dev = [
  "bandit>=1.7",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-requests>=2.32",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinfra_tasmota"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "PL", "RUF", "D"]
ignore = ["D203", "D212", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "D104", "D107", "PLC0415", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyinfra_tasmota --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  'def __repr__',
  'if TYPE_CHECKING:',
  'class .*\bProtocol\):',
  '@overload',
  '@(abc\.)?abstractmethod',
  'raise NotImplementedError',
  'raise AssertionError',
]

[tool.bandit]
skips = ["B101"]
exclude_dirs = [".venv", "tests"]
